name: NauGi checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart run tool/export_seed.dart && git diff --exit-code -- supabase/seed.sql
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: naugi-guest-apk
          path: build/app/outputs/flutter-apk/app-release.apk
  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/suggest-recipes/deno.json --lock supabase/functions/suggest-recipes/deno.lock --frozen supabase/functions/suggest-recipes/index.ts
      - run: deno test supabase/functions/suggest-recipes/logic_test.ts
