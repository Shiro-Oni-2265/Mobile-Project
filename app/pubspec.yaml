name: naugi
description: Sổ tay công thức, thực đơn, tủ lạnh và dinh dưỡng NauGi.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  http: ^1.6.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  image_picker: ^1.2.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  intl: any
  # Flutter 3.47.7 generates a Java registrant for every Android plugin even
  # when a dev-only plugin is omitted from releaseApi. Keep it available to
  # the demo release build as well as integration tests.
  integration_test:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.4
flutter:
  uses-material-design: true
  assets:
    - assets/data/
